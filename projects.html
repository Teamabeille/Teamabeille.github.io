<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projects — Soon</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("img/ocean.png") center/cover no-repeat fixed;
      font-family: "Segoe UI", "Frutiger", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .halo {
      position: absolute;
      width: 1100px;
      height: 1100px;
      background: radial-gradient(
        circle,
        rgba(0, 10, 40, 1) 0%,
        rgba(0, 30, 90, 0.95) 25%,
        rgba(0, 70, 160, 0.85) 50%,
        rgba(0, 120, 255, 0.55) 75%,
        rgba(0, 180, 255, 0.25) 90%
        rgba(0, 0, 0, 0) 100%
      );
      filter: blur(40px);
      top: -300px;
      left: -250px;
      opacity: 1;
      animation: float 10s ease-in-out infinite alternate;
      z-index: 0;
    }



    @keyframes float {
      from { transform: translate(0,0); }
      to { transform: translate(40px, 60px); }
    }

    h1 {
      font-size: 120px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 0 30px rgba(0,150,255,0.6);
      z-index: 2;
      user-select: none;
    }

    .play-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 26px;
      border-radius: 40px;
      border: none;
      background: linear-gradient(135deg, rgba(0,80,160,0.9), rgba(0,140,255,0.85));
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow:
        0 0 18px rgba(0,150,255,0.7),
        inset 0 0 12px rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
      transition: 0.25s ease;
      z-index: 10;
    }

    .play-btn:hover {
      transform: translateX(-50%) scale(1.08);
      box-shadow:
        0 0 28px rgba(0,200,255,0.9),
        inset 0 0 14px rgba(255,255,255,0.35);
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      pointer-events: none;
      opacity: 0.8;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.2;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
      }
    }


    .fish {
      position: absolute;
      pointer-events: none;
      opacity: 0.95;
    }
    
    .fish.ltr {
      animation: swim-ltr linear forwards;
    }
    
    .fish.rtl {
      animation: swim-rtl linear forwards;
    }
    
    @keyframes swim-ltr {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }
    
    @keyframes swim-rtl {
      0% { transform: translateX(0) scaleX(-1); }
      100% { transform: translateX(-120vw) scaleX(-1); }
    }

  </style>
</head>

<body>
<script>
  const nbBulles = 60;

  for (let i = 0; i < nbBulles; i++) {
    const b = document.createElement("img");
    b.src = "img/bubble.png";
    b.className = "bubble";

    const size = Math.floor(Math.random() * 30) + 20;
    b.style.width = size + "px";
    b.style.height = size + "px";

    b.style.left = Math.random() * 100 + "%";

    const duration = Math.random() * 10 + 8;
    b.style.animationDuration = duration + "s";

    const delay = Math.random() * 10;
    b.style.animationDelay = delay + "s";

    document.body.appendChild(b);
  }
</script>


<script>
  const leftFacing = [
    "img/fish/clown.png",
    "img/fish/tropical1.png",
    "img/fish/tropical2.png",
    "img/fish/tropical6.png"
  ];

  const rightFacing = [
    "img/fish/tropical3.png",
    "img/fish/tropical4.png",
    "img/fish/tropical5.png"
  ];

  function spawnFish() {
    const fish = document.createElement("img");

    const all = [...leftFacing, ...rightFacing];
    const chosen = all[Math.floor(Math.random() * all.length)];
    fish.src = chosen;

    const direction = Math.random() < 0.5 ? "ltr" : "rtl";

    const size = Math.floor(Math.random() * 100) + 80;
    fish.style.width = size + "px";

    fish.style.top = Math.random() * 75 + "%";

    const duration = Math.random() * 12 + 14;
    fish.style.animationDuration = duration + "s";

    const isLeft = leftFacing.includes(chosen);
    const isRight = rightFacing.includes(chosen);

    if (direction === "ltr") {
      fish.className = "fish ltr";
      fish.style.left = "-200px";

      if (isRight) fish.style.transform = "scaleX(1)";
    } else {
      fish.className = "fish rtl";
      fish.style.left = "100vw";

      if (isLeft) fish.style.transform = "scaleX(-1)";
    }

    document.body.appendChild(fish);

    setTimeout(() => fish.remove(), duration * 1000 + 500);
  }

  setInterval(spawnFish, 800); 
</script>




<div class="halo">SOON</div>

<h1>SOON</h1>

<button class="play-btn" id="playAmbiance">Play ambiance</button>

<audio id="ambiance" src="music/aquatic.mp3" preload="auto" loop></audio>

<script>
  const audio = document.getElementById('ambiance');
  const playBtn = document.getElementById('playAmbiance');

  const tryPlay = () => {
    audio.play().then(() => {
      playBtn.style.display = 'none';
      window.removeEventListener('pointerdown', tryPlay);
      window.removeEventListener('keydown', tryPlay);
    }).catch(() => {});
  };

  window.addEventListener('pointerdown', tryPlay, { once: true });
  window.addEventListener('keydown', tryPlay, { once: true });
  playBtn.addEventListener('click', tryPlay);
</script>

</body>
</html>
